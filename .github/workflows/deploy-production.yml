name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to production Netlify
    if: github.repository == 'timhurt/apm-production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build:production

      - name: Deploy production site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_PRODUCTION_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "Configure NETLIFY_PRODUCTION_AUTH_TOKEN and NETLIFY_PRODUCTION_SITE_ID in the production environment."
            exit 1
          fi
          node scripts/sync-form-notifications.mjs --prepare
          npx --yes netlify-cli@23 deploy --dir=dist --no-build --prod --site "$NETLIFY_SITE_ID" --message "GitHub Actions production release $GITHUB_SHA"

      - name: Verify inquiry email notifications
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_PRODUCTION_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
        run: node scripts/sync-form-notifications.mjs
